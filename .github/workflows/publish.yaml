# Publish to npm.
#
# Fires when a GitHub Release is published (release-please cuts the Release when
# its release PR merges), so npm never drifts behind the GitHub releases again.
# `workflow_dispatch` allows an on-demand (re)publish of the current default
# branch — used to publish a release that was cut before this workflow existed.
#
# Authenticates to npm with trusted publishing (OIDC), so there is no long-lived
# token here or in the repository secrets. npm mints a short-lived credential for
# this workflow after matching the OIDC claim against the trusted publisher
# registered on the package, which pins it to this repo and this filename.
# Renaming this file breaks publishing until npm is updated to match.
#
# Provenance is generated automatically under trusted publishing, so `--provenance`
# is not passed. Both need `id-token: write` and a public repo.
#
# npm 11.5.1 or later is required. Node 22 ships npm 10.9.8, which is too old, so
# the Node major is pinned at 24 (npm 11.19.0) for that reason and not for any
# language feature.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run smoke # build + token-free MCP handshake before we publish
      - run: npm publish --access public
